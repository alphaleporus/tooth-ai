# ============================================
# IMPROVED DETECTION CONFIG - Phase 1 & 2 Fix
# High Recall / Dense Object Detection
# Optimized for Panoramic Dental X-rays
# ============================================
#
# This configuration implements the approved remediation plan to fix
# the catastrophically low recall issue (20% -> target 80%+)
#
# Key Changes from Standard Config:
# 1. SCORE_THRESH_TEST: 0.3 -> 0.05 (Prioritize recall over precision)
# 2. NMS_THRESH_TEST: 0.5 -> 0.65 (Allow crowded teeth to overlap)
# 3. ASPECT_RATIOS: Added [0.2, 0.33] for thin vertical roots/incisors
# 4. DETECTIONS_PER_IMAGE: 200 -> 300 (Handle dense panoramic views)
# 5. MAX_SIZE_TEST: 1333 -> 1600 (Preserve high-res details for caries)
# ============================================

MODEL:
  META_ARCHITECTURE: "GeneralizedRCNN"
  
  # Pre-trained weights: ResNeXt-101-32x8d FPN (better than ResNet50)
  WEIGHTS: "detectron2://COCO-InstanceSegmentation/mask_rcnn_X_101_32x8d_FPN_3x/139653917/model_final_2d9806.pkl"
  
  MASK_ON: True
  PIXEL_MEAN: [103.530, 116.280, 123.675]
  PIXEL_STD: [1.0, 1.0, 1.0]
  
  # Backbone: ResNeXt-101-32x8d FPN
  BACKBONE:
    NAME: "build_resnet_fpn_backbone"
    FREEZE_AT: 2
  
  RESNETS:
    DEPTH: 101
    NUM_GROUPS: 32
    WIDTH_PER_GROUP: 8
    OUT_FEATURES: ["res2", "res3", "res4", "res5"]
    STRIDE_IN_1X1: False
    NORM: "FrozenBN"
  
  FPN:
    IN_FEATURES: ["res2", "res3", "res4", "res5"]
    OUT_CHANNELS: 256
  
  RPN:
    IN_FEATURES: ["p2", "p3", "p4", "p5", "p6"]
    PRE_NMS_TOPK_TRAIN: 2000
    PRE_NMS_TOPK_TEST: 1000
    POST_NMS_TOPK_TRAIN: 1000
    POST_NMS_TOPK_TEST: 1000
  
  # ============================================
  # CRITICAL FIX #1: Optimized Anchor Configuration
  # ============================================
  ANCHOR_GENERATOR:
    SIZES: [[16], [32], [64], [128], [256], [512]]  # Added 16 for small features
    # Aspect ratios optimized for dental features:
    # 0.2 (1:5 H:W) = Long thin roots, incisors
    # 0.33 (1:3 H:W) = Canines, premolar roots
    # 0.5 (1:2 H:W) = Standard vertical teeth
    # 1.0 (1:1 H:W) = Square features, anomalies
    # 2.0 (2:1 H:W) = Wide molars
    ASPECT_RATIOS: [[0.2, 0.33, 0.5, 1.0, 2.0]]
  
  # 9 classes: Tooth + 8 Anomalies
  ROI_HEADS:
    NAME: "CascadeROIHeads"
    IN_FEATURES: ["p2", "p3", "p4", "p5"]
    NUM_CLASSES: 9
    
    # ============================================
    # CRITICAL FIX #2: Lower Confidence Threshold
    # ============================================
    # Changed from 0.3 to 0.05 to prioritize recall
    # Medical imaging: better to flag potential issues than miss them
    SCORE_THRESH_TEST: 0.05
    
    # ============================================
    # CRITICAL FIX #3: Increase NMS Threshold
    # ============================================
    # Changed from 0.5 to 0.65
    # Higher threshold = LESS aggressive suppression
    # Allows adjacent teeth to coexist without being deleted
    NMS_THRESH_TEST: 0.65
    
    BATCH_SIZE_PER_IMAGE: 512
    POSITIVE_FRACTION: 0.25
  
  ROI_BOX_CASCADE_HEAD:
    IOUS: [0.5, 0.6, 0.7]
    
  ROI_BOX_HEAD:
    NAME: "FastRCNNConvFCHead"
    NUM_FC: 2
    FC_DIM: 1024
    POOLER_RESOLUTION: 7
    POOLER_SAMPLING_RATIO: 0
    POOLER_TYPE: "ROIAlignV2"
    CLS_AGNOSTIC_BBOX_REG: True
    
  ROI_MASK_HEAD:
    NAME: "MaskRCNNConvUpsampleHead"
    NUM_CONV: 4
    CONV_DIM: 256
    POOLER_RESOLUTION: 14
    POOLER_SAMPLING_RATIO: 0
    POOLER_TYPE: "ROIAlignV2"

# ============================================
# CRITICAL FIX #4: Increased Input Resolution
# ============================================
INPUT:
  MIN_SIZE_TRAIN: (640, 672, 704, 736, 768, 800)
  MAX_SIZE_TRAIN: 1600
  MIN_SIZE_TEST: 1000  # Increased from 800
  MAX_SIZE_TEST: 1600  # Increased from 1333
  FORMAT: "BGR"

# Use remapped dataset (9 classes)
DATASETS:
  TRAIN: ("tooth_remapped_train",)
  TEST: ("tooth_remapped_val",)

SOLVER:
  IMS_PER_BATCH: 4
  BASE_LR: 0.0005
  MOMENTUM: 0.9
  WEIGHT_DECAY: 0.0001
  GAMMA: 0.1
  STEPS: (30000, 45000)  # Extended for better convergence
  MAX_ITER: 60000  # Increased from 35000
  WARMUP_ITERS: 500
  WARMUP_FACTOR: 0.001
  WARMUP_METHOD: "linear"
  CHECKPOINT_PERIOD: 5000
  
  AMP:
    ENABLED: true

# ============================================
# CRITICAL FIX #5: RepeatFactorTrainingSampler
# ============================================
# Will be configured in train_net.py to oversample rare classes
DATALOADER:
  NUM_WORKERS: 2
  ASPECT_RATIO_GROUPING: True
  SAMPLER_TRAIN: "RepeatFactorTrainingSampler"  # Changed from TrainingSampler
  # Repeat factor settings handled in code

TEST:
  EVAL_PERIOD: 5000
  # ============================================
  # CRITICAL FIX #6: Increased Detection Budget
  # ============================================
  DETECTIONS_PER_IMAGE: 300  # Increased from 200

OUTPUT_DIR: "output/improved_detection_phase1"

VERSION: 2
